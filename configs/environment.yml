  - pyg
  - conda-forge
  - defaults
dependencies:
  - python=3.11
  - pytorch>=2.5
  - torchvision
  - pip
  - pip:
    - fair-esm>=2.0.0
    - torch-geometric
    - torch-scatter
    - torch-sparse
