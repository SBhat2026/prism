    - freesasa>=2.1
    - requests
    - networkx>=3.0
    - numpy
    - scipy
    - pandas
    - matplotlib
    - seaborn
    - tqdm
    - scikit-learn
    - jupyter
    - ipykernel
    - huggingface_hub
